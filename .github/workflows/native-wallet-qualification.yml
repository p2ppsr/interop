name: Native wallet qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      deadline: ${{ steps.admit.outputs.deadline }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/375754315907/locations/global/workloadIdentityPools/shared-device-ci/providers/github
          service_account: tpnil-device-worker@babbage-device-lab.iam.gserviceaccount.com
          project_id: babbage-device-tpnil
          token_format: access_token
          create_credentials_file: false
      - name: Fetch immutable transport
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 scripts/fetch-shared-device-runtime.py --runtime-only
      - id: admit
        name: Reserve gross cost before a Mac job can start
        env:
          SHARED_DEVICE_LAB_IDENTITY_MODE: github-oidc
          SHARED_DEVICE_LAB_GCP_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 "$RUNNER_TEMP/shared-device-runtime/scripts/shared-device-lab/github_job.py" reserve --tenant tpnil
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: admitted-runtime
          path: ${{ runner.temp }}/shared-device-runtime/transport.tgz
          retention-days: 1
  macos-native:
    needs: admit
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Verify remaining reservation time
        env:
          LEASE_DEADLINE: ${{ needs.admit.outputs.deadline }}
        run: test "$(( $(date +%s) + 900 ))" -lt "$LEASE_DEADLINE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Record runner environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tpnil-native-evidence"
          {
            printf 'execution_started_at=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf 'ImageOS=%s\n' "$ImageOS"
            printf 'ImageVersion=%s\n' "$ImageVersion"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            sw_vers
            uname -a
          } > "$RUNNER_TEMP/tpnil-native-evidence/environment.txt"
      - name: Install and exercise BSV Desktop
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/tpnil-native-evidence"
          dmg="$RUNNER_TEMP/BSV-Desktop-2.8.5-arm64-mac.dmg"
          mountpoint="$RUNNER_TEMP/bsv-desktop-mount"
          install_root="$RUNNER_TEMP/Applications"
          expected_sha='05dec27dc461d4a9fbbe9aafdec53bdb6e947b46c0d1652e16342da47471d12e'
          curl --fail --location --retry 4 --retry-all-errors \
            --output "$dmg" \
            'https://github.com/bsv-blockchain/bsv-desktop/releases/download/v2.8.5/BSV-Desktop-2.8.5-arm64-mac.dmg'
          actual_sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          stat -f 'artifact_size=%z' "$dmg" > "$evidence/artifact.txt"
          printf 'artifact_sha256=%s\n' "$actual_sha" >> "$evidence/artifact.txt"

          mkdir -p "$mountpoint" "$install_root"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg" > "$evidence/hdiutil-attach.txt"
          app_source="$(find "$mountpoint" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_source"
          /usr/bin/ditto "$app_source" "$install_root/BSV Desktop.app"
          hdiutil detach "$mountpoint" > "$evidence/hdiutil-detach.txt"
          app="$install_root/BSV Desktop.app"
          codesign --verify --deep --strict --verbose=2 "$app" 2> "$evidence/codesign-verify.txt"
          codesign -d --verbose=4 "$app" 2> "$evidence/codesign-details.txt"
          set +e
          spctl --assess --type execute --verbose=4 "$app" > "$evidence/gatekeeper.txt" 2>&1
          printf 'gatekeeper_exit=%s\n' "$?" >> "$evidence/gatekeeper.txt"
          set -e
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist" > "$evidence/app-version.txt"

          bundle_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          printf 'bundle_executable=%s\n' "$bundle_executable" >> "$evidence/app-version.txt"
          binary="$app/Contents/MacOS/$bundle_executable"
          test -x "$binary"
          terminate_app() {
            local pid="$1"
            kill -TERM "$pid" 2>/dev/null || true
            for attempt in $(seq 1 5); do
              if ! kill -0 "$pid" 2>/dev/null; then return; fi
              sleep 1
            done
            kill -KILL "$pid" 2>/dev/null || true
            pkill -KILL -f "$app/Contents/" 2>/dev/null || true
          }
          "$binary" --remote-debugging-port=9222 > "$evidence/app-first-launch.log" 2>&1 &
          first_pid=$!
          for attempt in $(seq 1 60); do
            cert="$(find "$HOME/Library/Application Support" -path '*/certs/server.crt' -print -quit 2>/dev/null || true)"
            if test -n "$cert" && curl --silent --fail http://127.0.0.1:9222/json/list >/dev/null; then break; fi
            sleep 1
          done
          test -n "${cert:-}"
          node scripts/native/electron-cdp.mjs wait-text 'Create Wallet' 60000 > "$evidence/pre-trust-ui.json"
          terminate_app "$first_pid"
          wait "$first_pid" 2>/dev/null || true

          sudo -n security add-trusted-cert -d -r trustRoot -p ssl \
            -k /Library/Keychains/System.keychain "$cert"
          security verify-cert -c "$cert" -p ssl -n localhost > "$evidence/certificate-verify.txt"

          "$binary" --remote-debugging-port=9222 > "$evidence/app-qualified-launch.log" 2>&1 &
          app_pid=$!
          cleanup() {
            terminate_app "$app_pid"
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9222/json/list >/dev/null; then break; fi
            sleep 1
          done
          node scripts/native/electron-cdp.mjs wait-text 'Create Wallet' 60000 > "$evidence/initial-ui.json"
          node scripts/native/electron-cdp.mjs click-text 'Create Wallet' > "$evidence/create-wallet.json"
          node scripts/native/electron-cdp.mjs wait-text 'Primary Key' 30000 > "$evidence/direct-key-ui.json"
          fixture_key="$(printf '%s' 'TPNIL ISI-4 isolated wallet identity v1' | shasum -a 256 | awk '{print $1}')"
          node scripts/native/electron-cdp.mjs fill-label 'Primary Key' "$fixture_key" > "$evidence/wallet-key-fill.json"
          node scripts/native/electron-cdp.mjs click-text 'Login' > "$evidence/wallet-login.json"
          node scripts/native/electron-cdp.mjs wait-text 'Create vault' 30000 > "$evidence/vault-ui.json"
          vault_passphrase="tpnil-$(printf '%s' 'TPNIL ISI-4 disposable vault v1' | shasum -a 256 | cut -c1-32)"
          node scripts/native/electron-cdp.mjs fill-label 'Unlock passphrase' "$vault_passphrase" > "$evidence/vault-fill.json"
          node scripts/native/electron-cdp.mjs fill-label 'Confirm passphrase' "$vault_passphrase" > "$evidence/vault-confirm.json"
          node scripts/native/electron-cdp.mjs click-text 'Create vault' > "$evidence/vault-create.json"
          for attempt in $(seq 1 60); do
            node scripts/native/electron-cdp.mjs snapshot > "$evidence/authenticated-ui.json"
            status="$(curl --silent --show-error --connect-timeout 2 --max-time 5 --cacert "$cert" \
              -H 'Origin: https://todo.itcve.test' -H 'Content-Type: application/json' \
              --output "$evidence/readiness-$attempt.json" --write-out '%{http_code}' \
              --data '{}' https://localhost:2121/isAuthenticated)"
            printf '%s attempt=%s http=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$attempt" "$status" >> "$evidence/readiness.log"
            cp "$evidence/readiness-$attempt.json" "$evidence/isAuthenticated.json"
            case "$status" in
              200)
                jq -e '.authenticated | type == "boolean"' "$evidence/isAuthenticated.json" >/dev/null
                if jq -e '.authenticated == true' "$evidence/isAuthenticated.json" >/dev/null; then break; fi
                ;;
              503) ;; # Wallet initialization is still in progress.
              *) printf 'Unexpected readiness status: %s\n' "$status" >&2; exit 1 ;;
            esac
            sleep 1
          done
          jq -e '.authenticated == true' "$evidence/isAuthenticated.json" >/dev/null
          node scripts/native/electron-cdp.mjs screenshot "$evidence/authenticated-ui.png" > "$evidence/screenshot.json"

          curl --fail --silent --show-error --cacert "$cert" \
            https://localhost:2121/manifest.json > "$evidence/bridge-manifest.json"
          for method in isAuthenticated getNetwork getVersion; do
            curl --fail --silent --show-error --cacert "$cert" \
              -H 'Origin: https://todo.itcve.test' -H 'Content-Type: application/json' \
              --data '{}' "https://localhost:2121/$method" > "$evidence/$method.json"
          done
          jq -e '.name == "BSV Desktop"' "$evidence/bridge-manifest.json" >/dev/null
          jq -e '.authenticated == true' "$evidence/isAuthenticated.json" >/dev/null
          jq -e '.network == "mainnet"' "$evidence/getNetwork.json" >/dev/null
          jq -e '.version | type == "string" and length > 0' "$evidence/getVersion.json" >/dev/null
          ps -axo pid,ppid,user,command | grep -E '[B]SV Desktop|[E]lectron' > "$evidence/processes.txt"
          cleanup
          trap - EXIT
          jq -n \
            --arg capturedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg sourceRevision "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            '{capturedAt:$capturedAt,repository:$repository,runId:$runId,runAttempt:$runAttempt,runUrl:$runUrl,sourceRevision:$sourceRevision,workflowRef:$workflowRef}' \
            > "$evidence/run-metadata.json"
          (cd "$evidence" && shasum -a 256 * | sort > SHA256SUMS)
      - name: Retain native qualification evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: bsv-desktop-macos-arm64-qualification
          path: ${{ runner.temp }}/tpnil-native-evidence
          if-no-files-found: error
          retention-days: 30
  release:
    needs: [admit, macos-native]
    if: always() && needs.admit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/375754315907/locations/global/workloadIdentityPools/shared-device-ci/providers/github
          service_account: tpnil-device-worker@babbage-device-lab.iam.gserviceaccount.com
          project_id: babbage-device-tpnil
          token_format: access_token
          create_credentials_file: false
      - name: Fetch immutable transport
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 scripts/fetch-shared-device-runtime.py --runtime-only
      - name: Confirm exact Mac job termination
        env:
          GH_TOKEN: ${{ github.token }}
          SHARED_DEVICE_LAB_IDENTITY_MODE: github-oidc
          SHARED_DEVICE_LAB_GCP_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: python3 "$RUNNER_TEMP/shared-device-runtime/scripts/shared-device-lab/github_job.py" release --tenant tpnil
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: hosted-macos-release
          path: ${{ runner.temp }}/shared-device-runtime/artifacts/ops/shared-device-lab-runs/
          if-no-files-found: warn
          retention-days: 30
