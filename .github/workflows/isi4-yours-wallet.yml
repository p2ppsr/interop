name: ISI-4 Yours Wallet controlled-service run
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Pinned controlled-service qualification lane'
        type: choice
        default: typescript
        options:
          - typescript
          - all-go-native
          - integrated-native
          - integrated-native-trusted
          - integrated-native-conformance
          - integrated-native-conformance-coverage
          - integrated-native-conformance-closure
          - integrated-native-conformance-closure-rust-v3
          - integrated-native-conformance-5.1.1
permissions:
  contents: read
jobs:
  yours-wallet:
    if: inputs.profile != 'all-go-native' && !startsWith(inputs.profile, 'integrated-native')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: synthesis/package-lock.json
      - name: Prepare exact artifacts and browser
        run: |
          set -euo pipefail
          scripts/prepare-yours-wallet-run.sh
          npm ci --prefix synthesis --ignore-scripts
          npx --prefix synthesis playwright install --with-deps chromium
      - name: Execute two clean repetitions
        run: |
          set -euo pipefail
          xvfb-run -a npm --prefix synthesis run wallet-lab -- run ../infra/plans/isi4-yours-todo-controlled-services.json
      - name: Verify retained result
        run: npm --prefix synthesis run wallet-lab -- verify ../out/isi4-yours-todo-controlled-services
      - name: Upload immutable evidence candidate
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: isi4-yours-wallet-5.1.0
          path: out/isi4-yours-todo-controlled-services
          if-no-files-found: error
          retention-days: 90
  all-go-native:
    if: inputs.profile == 'all-go-native' || startsWith(inputs.profile, 'integrated-native')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache-dependency-path: synthesis/go/go.sum
      - name: Prepare and verify immutable artifacts and Go host
        env:
          TPNIL_NATIVE_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [ "$TPNIL_NATIVE_PROFILE" = integrated-native-conformance-5.1.1 ]; then
            scripts/prepare-yours-wallet-run.sh --conformance-5.1.1
          else
            scripts/prepare-yours-wallet-run.sh
          fi
          npm ci --prefix synthesis --ignore-scripts
          npm run prepare:go
          cd synthesis/go
          go build -mod=readonly -trimpath -o ../../out/itcve-mongo ./cmd/itcve-mongo
      - name: Build the frozen native browser closure
        run: docker build --build-arg TPNIL_WALLET_VERSION=${{ inputs.profile == 'integrated-native-conformance-5.1.1' && '5.1.1' || '5.1.0' }} --iidfile out/native-go-image.id -f infra/native/yours-go/Dockerfile -t tpnil-native-go:${{ github.sha }} .
      - name: Install the pinned integrated service closure
        if: startsWith(inputs.profile, 'integrated-native')
        run: |
          npm ci --ignore-scripts --prefix components/transport
          node scripts/prepare-messaging.mjs
          node scripts/prepare-storage-sync-go.mjs
          npm ci --ignore-scripts --prefix integrations/services
          npm rebuild better-sqlite3 --prefix integrations/services
          rustup toolchain install 1.88.0 --profile minimal
          docker build --build-arg TPNIL_NATIVE_BASE=tpnil-native-go:${{ github.sha }} -f infra/native/integrated/Dockerfile -t tpnil-native-integrated:${{ github.sha }} .
      - name: Build the prospective conformance image
        if: startsWith(inputs.profile, 'integrated-native-conformance')
        run: |
          storage_binary=itcve-go-storage-portability
          if [[ "${{ inputs.profile }}" == "integrated-native-conformance-5.1.1" ]]; then
            node scripts/prepare-storage-list-actions-go.mjs
            storage_binary=itcve-go-storage-list-actions
          else
            node scripts/prepare-storage-portability-go.mjs
          fi
          docker build --build-arg TPNIL_STORAGE_BINARY="$storage_binary" --build-arg TPNIL_INTEGRATED_BASE=tpnil-native-integrated:${{ github.sha }} -f infra/native/conformance/Dockerfile -t tpnil-native-conformance:${{ github.sha }} .
      - name: Execute two clean isolated native repetitions and verify results
        if: inputs.profile == 'all-go-native'
        run: node scripts/run-native-go-wallet.mjs tpnil-native-go:${{ github.sha }} out/native-go-wallet
      - name: Execute and independently verify the integrated native wallet graph
        if: startsWith(inputs.profile, 'integrated-native')
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          TPNIL_NATIVE_PROFILE: ${{ inputs.profile }}
        run: |
          native_flag=--integrated
          native_image=tpnil-native-integrated:${{ github.sha }}
          if [ "$TPNIL_NATIVE_PROFILE" = integrated-native-trusted ]; then native_flag=--integrated-trusted; fi
          if [ "$TPNIL_NATIVE_PROFILE" = integrated-native-conformance ]; then native_flag=--conformance; native_image=tpnil-native-conformance:${{ github.sha }}; fi
          if [ "$TPNIL_NATIVE_PROFILE" = integrated-native-conformance-coverage ]; then native_flag=--conformance-coverage; native_image=tpnil-native-conformance:${{ github.sha }}; fi
          if [ "$TPNIL_NATIVE_PROFILE" = integrated-native-conformance-closure ]; then native_flag=--conformance-closure; native_image=tpnil-native-conformance:${{ github.sha }}; fi
          if [ "$TPNIL_NATIVE_PROFILE" = integrated-native-conformance-closure-rust-v3 ]; then native_flag=--conformance-closure-rust-v3; native_image=tpnil-native-conformance:${{ github.sha }}; fi
          if [ "$TPNIL_NATIVE_PROFILE" = integrated-native-conformance-5.1.1 ]; then native_flag=--conformance-5.1.1; native_image=tpnil-native-conformance:${{ github.sha }}; fi
          node scripts/run-native-go-wallet.mjs "$native_image" out/native-go-wallet "$native_flag"
          node scripts/verify-native-integrated.mjs out/native-go-wallet
      - name: Retain every attempt and qualification receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: native-go-yours-wallet-${{ inputs.profile == 'integrated-native-conformance-5.1.1' && '5.1.1' || '5.1.0' }}
          path: out/native-go-wallet
          if-no-files-found: error
          retention-days: 90
