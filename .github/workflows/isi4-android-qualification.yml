name: ISI-4 Android qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metanet-explorer:
    runs-on: [self-hosted, tpnil-android-qa, android-emulator, kvm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Acquire canonical AAB from the private artifact vault
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tpnil-artifacts" "$RUNNER_TEMP/tpnil-evidence"
          release_api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/sut-artifacts-2026-09-20"
          asset_api="$(
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$release_api" |
              jq --exit-status --raw-output \
                '.assets[] | select(.name == "metanet-explorer-v1.1.10.aab") | .url'
          )"
          aab="$RUNNER_TEMP/tpnil-artifacts/metanet-explorer-v1.1.10.aab"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$asset_api" --output "$aab"
          test "$(sha256sum "$aab" | awk '{print $1}')" = "8746b80347252bc35606cbefa40325131c9bf79eb6dbd140458766e9d513da3d"
          test "$(stat -c '%s' "$aab")" = "213058875"
          scripts/native/android/bundle-to-universal-apk.sh "$aab" "$RUNNER_TEMP/tpnil-apk" \
            > "$RUNNER_TEMP/tpnil-evidence/derivation.txt"
      - name: Start isolated emulator and exercise first-run boundary
        env:
          TPNIL_ANDROID_API: 35
        run: |
          set -euo pipefail
          scripts/native/android/create-avd.sh TPNIL_API_35 > "$RUNNER_TEMP/tpnil-evidence/avd.txt"
          adb start-server
          scripts/native/android/launch-emulator.sh TPNIL_API_35 5570 \
            > "$RUNNER_TEMP/tpnil-evidence/emulator.txt" 2>&1 &
          launcher_pid=$!
          cleanup() {
            adb -s emulator-5570 emu kill >/dev/null 2>&1 || true
            kill "$launcher_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 180); do
            if ! kill -0 "$launcher_pid" 2>/dev/null; then
              wait "$launcher_pid" || true
              cat "$RUNNER_TEMP/tpnil-evidence/emulator.txt" >&2
              exit 1
            fi
            test "$(adb -s emulator-5570 get-state 2>/dev/null || true)" = device && \
              test "$(adb -s emulator-5570 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 && break
            sleep 1
          done
          test "$(adb -s emulator-5570 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5570 install "$RUNNER_TEMP/tpnil-apk/universal.apk"
          adb -s emulator-5570 shell pm clear app.metanet.explorer
          adb -s emulator-5570 shell monkey -p app.metanet.explorer -c android.intent.category.LAUNCHER 1
          sleep 20
          scripts/native/android/capture-runtime.sh emulator-5570 app.metanet.explorer "$RUNNER_TEMP/tpnil-evidence"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: metanet-explorer-1.1.10-android-qualification
          path: ${{ runner.temp }}/tpnil-evidence
          if-no-files-found: error
          retention-days: 90
