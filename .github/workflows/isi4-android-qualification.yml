name: ISI-4 Android qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metanet-explorer:
    runs-on: [self-hosted, tpnil-android-qa, android-emulator, kvm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: synthesis/package-lock.json
      - name: Materialize exact evaluator dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tpnil-source"
          git -c advice.detachedHead=false clone --filter=blob:none --no-checkout \
            https://github.com/bsv-blockchain/ts-stack.git "$RUNNER_TEMP/tpnil-source/ts-stack"
          git -C "$RUNNER_TEMP/tpnil-source/ts-stack" fetch --depth=1 origin \
            6e53b215c43af5ea2e50bcdb7f136e23ee7da080
          git -C "$RUNNER_TEMP/tpnil-source/ts-stack" checkout --detach \
            6e53b215c43af5ea2e50bcdb7f136e23ee7da080
          test "$(git -C "$RUNNER_TEMP/tpnil-source/ts-stack" rev-parse HEAD)" = \
            6e53b215c43af5ea2e50bcdb7f136e23ee7da080
          npm ci --prefix synthesis
          npm ci --prefix "$RUNNER_TEMP/tpnil-source/ts-stack/infra/wab"
          npm run build --prefix "$RUNNER_TEMP/tpnil-source/ts-stack/infra/wab"
          test "$(sha256sum fixtures/artifacts/todo-ts-236733c-webroot.tgz | awk '{print $1}')" = \
            b3c41dc60ba99b497231008a15033a60110cc7cd60b2d4fffd405e33f4979ddc
          test "$(stat -c '%s' fixtures/artifacts/todo-ts-236733c-webroot.tgz)" = 502803
          test "$(sha256sum fixtures/teranode/wab-funding-v1.json | awk '{print $1}')" = \
            7c4fd4d2c98f8c80b4ac41614b09c9baed91c087b1a418e0f15edc6b8e55560a
          mkdir -p "$RUNNER_TEMP/tpnil-source/todo-webroot"
          tar --extract --gzip --file fixtures/artifacts/todo-ts-236733c-webroot.tgz \
            --directory "$RUNNER_TEMP/tpnil-source/todo-webroot"
          test -f "$RUNNER_TEMP/tpnil-source/todo-webroot/index.html"
      - name: Acquire canonical AAB from the private artifact vault
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tpnil-artifacts" "$RUNNER_TEMP/tpnil-evidence"
          auth_header="$RUNNER_TEMP/tpnil-github-auth-header"
          umask 077
          printf 'Authorization: Bearer %s\n' "$GH_TOKEN" > "$auth_header"
          trap 'rm -f "$auth_header"' EXIT
          release_api="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/sut-artifacts-2026-09-20"
          asset_api="$(
            curl --fail --silent --show-error --location \
              --header "@$auth_header" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$release_api" |
              jq --exit-status --raw-output \
                '.assets[] | select(.name == "metanet-explorer-v1.1.10.aab") | .url'
          )"
          aab="$RUNNER_TEMP/tpnil-artifacts/metanet-explorer-v1.1.10.aab"
          cache_directory="${TPNIL_SUT_ARTIFACT_CACHE:-/runner-cache/tpnil/artifacts}"
          cached_aab="$cache_directory/metanet-explorer-v1.1.10-8746b803.aab"
          mkdir -p "$cache_directory"
          artifact_source=verified-runner-cache
          if ! test -f "$cached_aab" || \
            ! test "$(sha256sum "$cached_aab" | awk '{print $1}')" = \
              8746b80347252bc35606cbefa40325131c9bf79eb6dbd140458766e9d513da3d || \
            ! test "$(stat -c '%s' "$cached_aab")" = 213058875; then
            artifact_source=private-artifact-vault
            incoming="$cached_aab.incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            rm -f "$incoming"
            curl --fail --silent --show-error --location \
              --header "@$auth_header" \
              --header "Accept: application/octet-stream" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$asset_api" --output "$incoming"
            test "$(sha256sum "$incoming" | awk '{print $1}')" = \
              8746b80347252bc35606cbefa40325131c9bf79eb6dbd140458766e9d513da3d
            test "$(stat -c '%s' "$incoming")" = 213058875
            mv "$incoming" "$cached_aab"
          fi
          cp "$cached_aab" "$aab"
          test "$(sha256sum "$aab" | awk '{print $1}')" = "8746b80347252bc35606cbefa40325131c9bf79eb6dbd140458766e9d513da3d"
          test "$(stat -c '%s' "$aab")" = "213058875"
          apk="$RUNNER_TEMP/tpnil-apk/universal.apk"
          cached_apk="$cache_directory/metanet-explorer-v1.1.10-c8bba03d.apk"
          mkdir -p "$RUNNER_TEMP/tpnil-apk"
          {
            printf 'artifact_source=%s\n' "$artifact_source"
            if test -f "$cached_apk" &&
              test "$(sha256sum "$cached_apk" | awk '{print $1}')" = \
                c8bba03da50a1f8ab61ef3c2ae45aac5d14d42bdb3eae40d709d18ae756b865f; then
              printf 'apk_source=verified-runner-cache\n'
              cp "$cached_apk" "$apk"
            else
              printf 'apk_source=derived-from-canonical-aab\n'
              scripts/native/android/bundle-to-universal-apk.sh "$aab" "$RUNNER_TEMP/tpnil-apk"
              test "$(sha256sum "$apk" | awk '{print $1}')" = \
                c8bba03da50a1f8ab61ef3c2ae45aac5d14d42bdb3eae40d709d18ae756b865f
              incoming_apk="$cached_apk.incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              cp "$apk" "$incoming_apk"
              mv "$incoming_apk" "$cached_apk"
            fi
            sha256sum "$aab" "$apk"
          } > "$RUNNER_TEMP/tpnil-evidence/derivation.txt"
      - name: Exercise controlled WAB, UMP, and ToDo vectors
        env:
          TPNIL_ANDROID_API: 35
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/tpnil-runtime"
          evidence_dir="$RUNNER_TEMP/tpnil-evidence"
          mkdir -p "$runtime_dir" "$evidence_dir"
          "$GITHUB_WORKSPACE/synthesis/node_modules/.bin/tsx" \
            "$GITHUB_WORKSPACE/synthesis/src/wallet-lab/android-runtime.ts" \
            "$RUNNER_TEMP/tpnil-source/ts-stack/infra/wab" \
            "$RUNNER_TEMP/tpnil-source/todo-webroot" \
            "$GITHUB_WORKSPACE/fixtures/teranode/wab-funding-v1.json" \
            "$runtime_dir" > "$evidence_dir/controller.log" 2>&1 &
          runtime_pid=$!
          for attempt in $(seq 1 180); do
            kill -0 "$runtime_pid" 2>/dev/null || {
              cat "$evidence_dir/controller.log" >&2
              exit 1
            }
            test -s "$runtime_dir/runtime.json" && test -s "$runtime_dir/.activation.json" && break
            sleep 1
          done
          test -s "$runtime_dir/runtime.json"
          test -s "$runtime_dir/.activation.json"
          jq 'del(.caCertificate, .phoneNumber)' "$runtime_dir/runtime.json" > "$evidence_dir/runtime.json"
          scripts/native/android/create-avd.sh TPNIL_API_35 > "$RUNNER_TEMP/tpnil-evidence/avd.txt"
          adb start-server
          scripts/native/android/launch-emulator.sh TPNIL_API_35 5570 \
            > "$RUNNER_TEMP/tpnil-evidence/emulator.txt" 2>&1 &
          launcher_pid=$!
          cleanup() {
            if test "$(adb -s emulator-5570 get-state 2>/dev/null || true)" = device; then
              adb -s emulator-5570 exec-out screencap -p > "$evidence_dir/last-screen.png" || true
              adb -s emulator-5570 shell uiautomator dump /sdcard/tpnil-last-window.xml >/dev/null 2>&1 || true
              adb -s emulator-5570 shell cat /sdcard/tpnil-last-window.xml > "$evidence_dir/last-window.xml" 2>/dev/null || true
            fi
            adb -s emulator-5570 emu kill >/dev/null 2>&1 || true
            for attempt in $(seq 1 30); do
              kill -0 "$launcher_pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$launcher_pid" 2>/dev/null; then
              kill "$launcher_pid" >/dev/null 2>&1 || true
            fi
            wait "$launcher_pid" >/dev/null 2>&1 || true
            kill -TERM "$runtime_pid" >/dev/null 2>&1 || true
            wait "$runtime_pid" >/dev/null 2>&1 || true
            rm -f "$runtime_dir/.activation.json" "$runtime_dir/wab.log"
            if test -s "$runtime_dir/controlled-boundary.json"; then
              cp "$runtime_dir/controlled-boundary.json" "$evidence_dir/controlled-boundary.json"
            fi
          }
          trap cleanup EXIT
          for attempt in $(seq 1 180); do
            if ! kill -0 "$launcher_pid" 2>/dev/null; then
              wait "$launcher_pid" || true
              cat "$RUNNER_TEMP/tpnil-evidence/emulator.txt" >&2
              exit 1
            fi
            test "$(adb -s emulator-5570 get-state 2>/dev/null || true)" = device && \
              test "$(adb -s emulator-5570 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 && break
            sleep 1
          done
          test "$(adb -s emulator-5570 shell getprop sys.boot_completed | tr -d '\r')" = 1
          bash -x scripts/native/android/install-controlled-ca.sh \
            emulator-5570 \
            "$(jq --raw-output .caCertificate "$runtime_dir/runtime.json")" \
            "$(jq --raw-output .proxyUrl "$runtime_dir/runtime.json")" \
            > "$evidence_dir/controlled-ca.txt" 2>&1
          adb -s emulator-5570 install "$RUNNER_TEMP/tpnil-apk/universal.apk"
          adb -s emulator-5570 shell pm clear app.metanet.explorer
          adb -s emulator-5570 shell input keyevent KEYCODE_HOME
          sleep 10
          kill -0 "$launcher_pid"
          task_name="TPNIL-WAB-UMP-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          task_amount=7
          todo_url="https://todo.itcve.test/"
          todo_create_url="https%3A%2F%2Ftodo.itcve.test%2F%3Fp0Task%3D${task_name}%26p0Amount%3D${task_amount}%26p0OpenCreate%3D1%26p0ImmediateBroadcast%3D1"
          todo_complete_url="https%3A%2F%2Ftodo.itcve.test%2F%3Fp0CompleteTask%3D${task_name}%26p0ImmediateBroadcast%3D1"
          otp="$(jq --exit-status --raw-output .code "$runtime_dir/.activation.json")"
          rm -f "$runtime_dir/.activation.json"
          maestro_bin="${MAESTRO_BIN:-$HOME/.maestro/bin/maestro}"
          test -x "$maestro_bin"
          "$maestro_bin" test \
            -e TPNIL_WAB_URL="$(jq --raw-output .wabUrl "$runtime_dir/runtime.json")" \
            -e TPNIL_STORAGE_URL="$(jq --raw-output .storageUrl "$runtime_dir/runtime.json")" \
            -e TPNIL_PHONE_NATIONAL=5550102030 \
            -e TPNIL_OTP="$otp" \
            -e TPNIL_WALLET_PASSWORD=TPNIL-Fixture-2026! \
            -e TPNIL_TODO_URL="$todo_url" \
            -e TPNIL_TODO_CREATE_URL="$todo_create_url" \
            -e TPNIL_TODO_COMPLETE_URL="$todo_complete_url" \
            -e TPNIL_TASK_NAME="$task_name" \
            -e TPNIL_TASK_AMOUNT="$task_amount" \
            --format junit \
            --output "$evidence_dir/maestro.xml" \
            --debug-output "$evidence_dir/maestro-debug" \
            scripts/native/android/metanet-controlled-wab.yaml
          scripts/native/android/capture-runtime.sh emulator-5570 app.metanet.explorer "$evidence_dir/final"
          cleanup
          trap - EXIT
          test -s "$evidence_dir/controlled-boundary.json"
          jq --exit-status '.umpRecords | length >= 1' "$evidence_dir/controlled-boundary.json" >/dev/null
          jq --exit-status '[.submissions[] | select(.verdict == "ACCEPTED_BY_NETWORK")] | length >= 3' \
            "$evidence_dir/controlled-boundary.json" >/dev/null
          jq --exit-status '[.routes[] | select(.host == "wab.itcve.test")] | length >= 4' \
            "$evidence_dir/controlled-boundary.json" >/dev/null
          jq --exit-status '[.routes[] | select(.host == "todo.itcve.test")] | length >= 1' \
            "$evidence_dir/controlled-boundary.json" >/dev/null
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: metanet-explorer-1.1.10-android-qualification
          path: ${{ runner.temp }}/tpnil-evidence
          if-no-files-found: error
          retention-days: 90
