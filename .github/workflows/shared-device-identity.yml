name: Shared device identity
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/375754315907/locations/global/workloadIdentityPools/shared-device-ci/providers/github
          service_account: tpnil-device-worker@babbage-device-lab.iam.gserviceaccount.com
          project_id: babbage-device-tpnil
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::380794909093:role/shared-device-lab/babbage-device-lab-tpnil-ci
          role-duration-seconds: 900
          allowed-account-ids: '380794909093'
      - name: Verify scoped identities and shared admission state
        env:
          TENANT: tpnil
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          DEVICE_PROJECT: babbage-device-tpnil
          OTHER_DEVICE_PROJECT: babbage-device-proofrun
          AWS_PROJECT_ARN: arn:aws:devicefarm:us-west-2:380794909093:project:964c6064-e4e3-4713-b66e-f3ec9b41f718
          OTHER_AWS_PROJECT_ARN: arn:aws:devicefarm:us-west-2:380794909093:project:02bba469-535d-42e3-a1e6-f4a522273072
        run: python3 scripts/check-shared-device-identity.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: shared-device-identity
          path: shared-device-identity.json
          if-no-files-found: error
          retention-days: 30
